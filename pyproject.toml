[project]
name = "mcp-quant-agent"
version = "0.1.0"
description = "Autonomous Trading Agents via Model Context Protocol — MSc thesis, Imperial College London"
readme = "README.md"
license = { text = "Academic use" }
requires-python = ">=3.11"
dependencies = [
    # MCP protocol (FastMCP is bundled inside mcp[cli] since v1.2)
    "mcp[cli]>=1.4,<2",
    # Orchestration
    "langgraph>=0.2,<2",
    "langchain-openai>=0.3,<2",
    "langchain-core>=0.3,<2",
    # LLM backbone — agents run on OpenAI; Claude Code is for code only
    "openai>=1.45,<2",
    # Observability — Langfuse Cloud (SDK v3+ / "v4 API" per CLAUDE.md)
    # Do NOT self-host. Cost covered by YC credits.
    "langfuse>=3.0,<5",
    # Market data
    "yfinance>=0.2.50,<1",
    "finnhub-python>=2.4,<3",
    # Data / IO
    "pandas>=2.2,<3",
    "pyarrow>=16,<20",
    "numpy>=1.26,<3",
    # Config
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.5,<3",
    "python-dotenv>=1.0,<2",
    # HTTP
    "httpx>=0.27,<1",
    "requests>=2.31,<3",
    # CLI
    "typer>=0.12,<2",
    "rich>=13.7,<15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    "pandas-stubs>=2.2,<3",
    "types-requests>=2.31,<3",
]
# FinBERT sentiment — install torch separately to match your CUDA/MPS platform
sentiment = [
    "transformers>=4.44,<5",
]
# Vectorised baseline computation — optional because vectorbt has complex deps
backtest = [
    "vectorbt>=0.26,<1",
    "scipy>=1.13,<2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_quant_agent"]

# ── ruff ──────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in default arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101", "S311"]  # relax annotations and asserts in tests
"scripts/**" = ["ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── mypy ──────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
# Exclude generated stubs and scripts where strict typing is noisy
exclude = ["scripts/", "docs/"]

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "finnhub.*",
    "vectorbt.*",
    "transformers.*",
    "langfuse.*",
    "langgraph.*",
    "langchain.*",
    "langchain_openai.*",
    "langchain_core.*",
    "mcp.*",
    "scipy.*",
    "torch.*",
]
ignore_missing_imports = true

# ── pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
